name: Ephemeral F5 fresh ISO proof

on:
  push:
    branches:
      - f5-fresh-iso-proof

permissions:
  contents: read

concurrency:
  group: f5-fresh-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fresh-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TARGET_SHA: 0dac331a8611c669801924394a2f28d94430e957
      ISO_SHA: 268bac16d351a21d867e37565738f458b11cb06c
      PKGS_SHA: a8c9e2982e965d140adcbe3138fa44c2d538d60b
      ARCH_BUILD_IMAGE: archlinux/archlinux@sha256:b7a2cf351dd0aebb189d366836047291bf0b4e0d2fc9bd35037a3a3bd719af9d
      ARCH_TEST_IMAGE: archlinux:base-devel@sha256:68bfc3b0d277b08a99101dc9b94aaa03e5ae70cf1b4fb965c03b2b87b915760d
      ARCH_TEST_RUNTIME_IMAGE: omarchy-f5-test:exact

    steps:
      - name: Reclaim ephemeral runner disk and record capacity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          df -h / | tee artifacts/preflight.log
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo rm -rf -- /opt/hostedtoolcache /usr/share/swift
          docker system prune --all --force
          df -h / | tee -a artifacts/preflight.log
          available_kib=$(df -Pk / | awk 'NR == 2 { print $4 }')
          (( available_kib >= 40 * 1024 * 1024 )) || {
            echo "F5 requires at least 40 GiB free after measured runner cleanup" >&2
            exit 1
          }

      - name: Verify KVM and runner memory before downloading the mirror
        shell: bash
        run: |
          set -euo pipefail
          [[ -c /dev/kvm ]] || {
            ls -l /dev/kvm || true
            echo "ubuntu-latest does not expose /dev/kvm" >&2
            exit 1
          }
          { printf 'KVM before: '; ls -l /dev/kvm; } | tee -a artifacts/preflight.log
          sudo chmod 0666 /dev/kvm
          { printf 'KVM after: '; ls -l /dev/kvm; } | tee -a artifacts/preflight.log
          [[ -r /dev/kvm && -w /dev/kvm ]] || {
            echo "runner cannot read and write /dev/kvm after scoped permission grant" >&2
            exit 1
          }
          python3 - <<'PY' | tee -a artifacts/preflight.log
          import fcntl
          import os

          with open("/dev/kvm", "rb+", buffering=0) as kvm:
              version = fcntl.ioctl(kvm.fileno(), 0xAE00, 0)
          if version != 12:
              raise SystemExit(f"unexpected KVM API version: {version}")
          print(f"KVM API version: {version}")
          PY
          available_kib=$(awk '/^MemAvailable:/ { print $2 }' /proc/meminfo)
          (( available_kib >= 12 * 1024 * 1024 )) || {
            echo "F5 requires at least 12 GiB available before starting a 7 GiB VM" >&2
            exit 1
          }
          grep -E '^(MemTotal|MemAvailable):' /proc/meminfo | tee -a artifacts/preflight.log

      - name: Fetch exact candidate and official build inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ $TARGET_SHA =~ ^[0-9a-f]{40}$ ]] || {
            echo "target_sha must be a lowercase full commit id" >&2
            exit 1
          }
          fetch_exact() {
            local url=$1 sha=$2 destination=$3
            git init -q "$destination"
            git -C "$destination" remote add origin "$url"
            git -C "$destination" fetch --no-tags --depth=1 origin "$sha"
            git -C "$destination" checkout -q --detach FETCH_HEAD
            [[ $(git -C "$destination" rev-parse HEAD) == "$sha" ]]
          }
          fetch_exact https://github.com/jacob-vincent-mink/omarchy.git "$TARGET_SHA" target
          fetch_exact https://github.com/omacom/omarchy-iso.git "$ISO_SHA" omarchy-iso
          fetch_exact https://github.com/omacom/omarchy-pkgs.git "$PKGS_SHA" omarchy-pkgs
          git -C omarchy-iso submodule update --init --recursive --jobs=8
          git -C omarchy-pkgs apply --check "$GITHUB_WORKSPACE/target/native/plugin-runtime/packaging/omarchy-dev-plugin-runtime.patch"
          git -C omarchy-pkgs apply "$GITHUB_WORKSPACE/target/native/plugin-runtime/packaging/omarchy-dev-plugin-runtime.patch"
          git -C omarchy-pkgs diff --check
          package_builder=omarchy-iso/builder/build-omarchy-packages.sh
          old_makepkg='makepkg --noconfirm --skippgpcheck --skipchecksums --nodeps -f'
          new_makepkg='makepkg --noconfirm --skippgpcheck --skipchecksums --nodeps --nocheck -f'
          (( $(grep -Fc "$old_makepkg" "$package_builder") == 1 )) || {
            echo "official package-builder makepkg seam changed" >&2
            exit 1
          }
          sed -i "s/$old_makepkg/$new_makepkg/" "$package_builder"
          acceptance_harness=omarchy-iso/bin/omarchy-iso-test
          old_ocr='  tesseract "$prepped" - --psm 6 2>/dev/null || true'
          new_ocr='  { tesseract "$prepped" - --psm 6; tesseract "$prepped" - --psm 3; } 2>/dev/null || true'
          (( $(grep -Fxc "$old_ocr" "$acceptance_harness") == 1 )) || {
            echo "official acceptance OCR seam changed" >&2
            exit 1
          }
          sed -i "s@$old_ocr@$new_ocr@" "$acceptance_harness"
          git -C omarchy-iso diff --check
          {
            echo "PACKAGE-CONTAINER CHECK() WAS NOT RUN"
            echo "The complete suite requires host namespaces and graphical session authorities absent from the official ISO package-builder container."
            echo "Fresh KVM VM acceptance remains mandatory later in this job."
            git -C omarchy-iso diff -- builder/build-omarchy-packages.sh
          } | tee artifacts/package-check-adaptation.log
          {
            echo "ACCEPTANCE OCR RUNS BOTH THE PINNED PSM 6 PASS AND A PSM 3 SELECTED-WIDGET PASS"
            echo "The exact failed-run screenshot omitted selected green text under PSM 6 and read it under PSM 3."
            git -C omarchy-iso diff -- bin/omarchy-iso-test
          } | tee artifacts/acceptance-ocr-adaptation.log
          {
            echo "target=$TARGET_SHA"
            echo "iso=$ISO_SHA"
            echo "pkgs=$PKGS_SHA"
            echo "arch_build=$ARCH_BUILD_IMAGE"
            echo "arch_test=$ARCH_TEST_IMAGE"
            echo "package_container_check=not_run_environment_incompatible"
            echo "acceptance_ocr_adaptation=psm6_plus_psm3"
          } > artifacts/provenance.log

      - name: Seed exact Arch build image with companion-patch prerequisites
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$ARCH_BUILD_IMAGE"
          cleanup() {
            docker rm --force f5-arch-build-seed >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --name f5-arch-build-seed "$ARCH_BUILD_IMAGE" \
            pacman -Syu --noconfirm base-devel bubblewrap cmake libseccomp ninja qt6-base qt6-declarative
          docker commit f5-arch-build-seed archlinux/archlinux:latest >/dev/null
          cleanup
          trap - EXIT

      - name: Preflight pinned Arch package-verifier environment
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -w "$GITHUB_WORKSPACE" \
            archlinux/archlinux:latest bash -lc '
              set -euo pipefail
              for command in awk basename bsdtar chmod cp file find gcc grep ldd mktemp mv objdump readelf rm sed sha256sum sort stat touch zstd; do
                command -v "$command" >/dev/null || {
                  echo "pinned Arch verifier environment lacks $command" >&2
                  exit 1
                }
              done
              [[ -x /usr/lib/qt6/bin/qml ]] || {
                echo "pinned Arch verifier environment lacks /usr/lib/qt6/bin/qml" >&2
                exit 1
              }
              [[ -x target/native/plugin-runtime/packaging/verify-package.sh &&
                 -x target/native/plugin-runtime/packaging/verify-package-test.sh ]] || {
                echo "exact candidate lacks executable package verifiers" >&2
                exit 1
              }
              echo "pinned Arch package-verifier environment passed preflight"
            '

      - name: Seed and preflight exact Arch VM-test environment
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$ARCH_TEST_IMAGE"
          container_id=$(docker run -d \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            "$ARCH_TEST_IMAGE" sleep infinity)
          cleanup_test_seed() {
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup_test_seed EXIT
          docker exec "$container_id" pacman -Syu --noconfirm \
            coreutils edk2-ovmf findutils grep imagemagick openssh python qemu-full sed socat tar tesseract tesseract-data-eng util-linux
          docker exec \
            -e "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" \
            "$container_id" bash -lc '
              set -euo pipefail
              required=(
                awk basename cat chmod cp date dirname du find grep kill magick mkdir mktemp nproc
                python3 qemu-img qemu-system-x86_64 rm sed setsid sleep socat sort ssh ssh-keygen
                stat tar tesseract timeout tr
              )
              for command_name in "${required[@]}"; do
                command -v "$command_name" >/dev/null || {
                  echo "missing VM-test harness command: $command_name" >&2
                  exit 1
                }
              done
              [[ -r /usr/share/edk2/x64/OVMF_CODE.4m.fd && -r /usr/share/edk2/x64/OVMF_VARS.4m.fd ]]
              bash -n "$GITHUB_WORKSPACE/omarchy-iso/bin/omarchy-iso-test"
              qemu-system-x86_64 --version
              qemu-img --version
              ssh -V
              magick -version
              tesseract --version
              socat -V
            '
          docker commit "$container_id" "$ARCH_TEST_RUNTIME_IMAGE" >/dev/null
          cleanup_test_seed
          trap - EXIT
          test_runtime_id=$(docker image inspect --format '{{.Id}}' "$ARCH_TEST_RUNTIME_IMAGE")
          {
            echo "arch_test_runtime_image=$ARCH_TEST_RUNTIME_IMAGE"
            echo "arch_test_runtime_image_id=$test_runtime_id"
            echo 'arch_test_runtime_packages=coreutils,edk2-ovmf,findutils,grep,imagemagick,openssh,python,qemu-full,sed,socat,tar,tesseract,tesseract-data-eng,util-linux'
            echo 'arch_test_harness_preflight=all_host_commands_and_ovmf_present'
          } | tee -a artifacts/provenance.log

      - name: Build fresh local-source ISO and package checks
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          (
            cd omarchy-iso
            NO_BOOT_OFFER=1 ./bin/omarchy-iso-make \
              --keep-pkg-cache \
              --no-boot-offer \
              --local-source "$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/omarchy-pkgs"
          ) 2>&1 | tee artifacts/iso-build.log
          mapfile -t isos < <(find omarchy-iso/release -maxdepth 1 -type f -name '*-local.iso' -print)
          (( ${#isos[@]} == 1 )) || {
            printf 'Expected one local ISO, found %s\n' "${#isos[@]}" >&2
            exit 1
          }
          iso_path=$(readlink -f "${isos[0]}")
          printf 'ISO_PATH=%s\n' "$iso_path" >> "$GITHUB_ENV"
          sha256sum "$iso_path" | tee -a artifacts/provenance.log

      - name: Verify exact locally built plugin package
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          mapfile -t packages < <(find "$HOME/.cache/omarchy/iso_edge" -type f -name 'omarchy-dev-*.pkg.tar.zst' -print)
          (( ${#packages[@]} == 1 )) || {
            printf 'Expected one omarchy-dev archive, found %s\n' "${#packages[@]}" >&2
            exit 1
          }
          package=${packages[0]}
          package=$(readlink -f "$package")
          docker run --rm \
            -e "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" \
            -e "PACKAGE=$package" \
            -e "TARGET_SHA=$TARGET_SHA" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$HOME/.cache/omarchy:$HOME/.cache/omarchy:ro" \
            -w "$GITHUB_WORKSPACE" \
            archlinux/archlinux:latest bash -lc '
              set -euo pipefail
              set -o pipefail
              short_sha=${TARGET_SHA:0:7}
              package_name=$(basename "$PACKAGE")
              [[ $package_name == *".g$short_sha-"* ]] || {
                echo "local package name does not bind final target $short_sha: $package_name" >&2
                exit 1
              }
              package_version=$(bsdtar -xOf "$PACKAGE" .PKGINFO | sed -n "s/^pkgver = //p")
              [[ $package_version == *".g$short_sha-"* ]] || {
                echo "local package metadata does not bind final target $short_sha: $package_version" >&2
                exit 1
              }
              sha256sum "$PACKAGE" | tee -a artifacts/provenance.log
              target/native/plugin-runtime/packaging/verify-package.sh "$PACKAGE" 2>&1 | tee artifacts/package-verifier.log
              target/native/plugin-runtime/packaging/verify-package-test.sh "$PACKAGE" 2>&1 | tee artifacts/package-verifier-negative.log

              package_root=$(mktemp -d)
              trap '\''rm -rf -- "$package_root"'\'' EXIT
              bsdtar -xf "$PACKAGE" -C "$package_root"
              host_hash=$(sha256sum "$package_root/usr/bin/omarchy-plugin-host" | awk "{ print \$1 }")
              worker_hash=$(sha256sum "$package_root/usr/lib/omarchy/plugin-runtime/omarchy-plugin-qml-worker" | awk "{ print \$1 }")
              bridge_hash=$(sha256sum "$package_root/usr/lib/qt6/qml/Omarchy/PluginHost/libomarchy-plugin-host-bridge.so" | awk "{ print \$1 }")
              identity_test=target/test/acceptance.d/zz-plugin-package-identity-test.sh
              {
                printf "%s\\n" "#!/bin/bash" "" "set -euo pipefail" "source \"\$(dirname \"\$0\")/base-test.sh\""
                printf "expected_package=%q\\n" "omarchy-dev $package_version"
                printf "expected_host_hash=%q\\n" "$host_hash"
                printf "expected_worker_hash=%q\\n" "$worker_hash"
                printf "expected_bridge_hash=%q\\n" "$bridge_hash"
                printf "%s\\n" \
                  "actual_package=\$(pacman -Q omarchy-dev)" \
                  "[[ \$actual_package == \"\$expected_package\" ]] || fail \"installed plugin package matches exact local build version\" \"expected \$expected_package, got \$actual_package\"" \
                  "{" \
                  "  printf \"%s  %s\\\\n\" \"\$expected_host_hash\" /usr/bin/omarchy-plugin-host" \
                  "  printf \"%s  %s\\\\n\" \"\$expected_worker_hash\" /usr/lib/omarchy/plugin-runtime/omarchy-plugin-qml-worker" \
                  "  printf \"%s  %s\\\\n\" \"\$expected_bridge_hash\" /usr/lib/qt6/qml/Omarchy/PluginHost/libomarchy-plugin-host-bridge.so" \
                  "} | sha256sum --check - >\"\$ARTIFACTS/plugin-package-identity.log\" 2>&1 || fail \"installed plugin payload matches exact local-source archive\"" \
                  "printf \"%s\\\\n\" \"\$actual_package\" >>\"\$ARTIFACTS/plugin-package-identity.log\"" \
                  "pass \"installed secure plugin payload matches exact local-source archive\""
              } >"$identity_test"
              chmod 755 "$identity_test"
              bash -n "$identity_test"
              {
                echo "package_version=$package_version"
                echo "host_sha256=$host_hash"
                echo "worker_sha256=$worker_hash"
                echo "bridge_sha256=$bridge_hash"
                echo "acceptance_overlay=exact_package_identity_probe"
              } | tee -a artifacts/provenance.log
            '

      - name: Reclaim build cache before the 40 GiB sparse VM disk
        shell: bash
        run: |
          set -euo pipefail
          cache_path="$HOME/.cache/omarchy"
          [[ -n $HOME && $HOME == /home/runner ]] || {
            printf 'Refusing cache cleanup for unexpected runner HOME: %q\n' "$HOME" >&2
            exit 1
          }
          [[ -n $cache_path && $cache_path == "$HOME/.cache/omarchy" && $cache_path == "$HOME"/* ]] || {
            printf 'Refusing unsafe cache cleanup path: %q\n' "$cache_path" >&2
            exit 1
          }
          [[ -d $cache_path && ! -L $cache_path ]] || {
            printf 'Expected a real cache directory at %q\n' "$cache_path" >&2
            exit 1
          }
          {
            echo 'Privileged ISO cache before exact-path cleanup:'
            stat -c 'path=%n owner=%U:%G mode=%a' "$cache_path"
            du -sh -- "$cache_path"
          } | tee -a artifacts/preflight.log
          sudo rm -rf -- "$cache_path"
          [[ ! -e $cache_path && ! -L $cache_path ]] || {
            printf 'Cache cleanup did not remove %q\n' "$cache_path" >&2
            exit 1
          }
          docker image rm archlinux/archlinux:latest "$ARCH_BUILD_IMAGE" "$ARCH_TEST_IMAGE" || true
          docker image prune --force
          df -h / | tee -a artifacts/preflight.log
          available_kib=$(df -Pk / | awk 'NR == 2 { print $4 }')
          (( available_kib >= 40 * 1024 * 1024 )) || {
            echo "F5 requires at least 40 GiB free while retaining the preflighted VM-test image" >&2
            exit 1
          }

      - name: Run fresh headless install and graphical acceptance
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          set +e
          docker run --rm \
            --device=/dev/kvm \
            -e "OMARCHY_PATH=$GITHUB_WORKSPACE/target" \
            -e "ISO_PATH=$ISO_PATH" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE/omarchy-iso" \
            "$ARCH_TEST_RUNTIME_IMAGE" bash -lc '
              set -euo pipefail
              export PATH="$OMARCHY_PATH/bin:$PATH"
              ./bin/omarchy-iso-test "$ISO_PATH" \
                --memory 7168 \
                --timeout 3600 \
                --sync-omarchy "$OMARCHY_PATH" \
                --no-preview
            ' 2>&1 | tee artifacts/iso-test.log
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          (( pipeline_status[1] == 0 )) || {
            echo "iso-test.log capture failed with status ${pipeline_status[1]}" >&2
            exit 1
          }
          acceptance_status=${pipeline_status[0]}
          echo "aggregate_acceptance_exit_status=$acceptance_status" | tee -a artifacts/provenance.log
          for proof in \
            'ok - installed secure plugin payload matches exact local-source archive' \
            'ok - direct secure plugin worker launch is denied' \
            'ok - secure plugin host service remains disabled and inactive' \
            'ok - secure plugin bridge appears in the graphical session' \
            'ok - secure plugin bridge reports the reference runtime as feature-gated' \
            'ok - secure plugin bridge module loads with packaged Qt under Wayland and remains feature-gated' \
            ; do
            grep -F "$proof" artifacts/iso-test.log >/dev/null || {
              echo "mandatory acceptance proof is absent from iso-test.log: $proof" >&2
              exit 1
            }
          done
          if grep -E '^not ok - .*secure plugin' artifacts/iso-test.log; then
            echo "plugin acceptance emitted a failure" >&2
            exit 1
          fi
          mapfile -t failures < <(grep -E '^not ok - ' artifacts/iso-test.log || true)
          if (( acceptance_status == 0 )); then
            (( ${#failures[@]} == 0 )) || {
              echo "aggregate acceptance returned success while reporting failures" >&2
              exit 1
            }
            grep -F 'Acceptance suite passed. Artifacts:' artifacts/iso-test.log >/dev/null || {
              echo "aggregate acceptance success summary is absent" >&2
              exit 1
            }
            echo 'aggregate_acceptance=pass' | tee -a artifacts/provenance.log
          else
            (( acceptance_status == 1 )) || {
              echo "aggregate acceptance failed with unexpected process status $acceptance_status" >&2
              exit 1
            }
            normalized_failures=()
            for failure in "${failures[@]}"; do
              if [[ $failure =~ ^not\ ok\ -\ acceptance\ suite\ failed\ in\ [0-9]+s\ \(artifacts\ in\ /tmp/omarchy-acceptance\)$ ]]; then
                normalized_failures+=('not ok - acceptance suite failed in <seconds>s (artifacts in /tmp/omarchy-acceptance)')
              else
                normalized_failures+=("$failure")
              fi
            done
            expected_failures=(
              'not ok - acceptance suite failed in <seconds>s (artifacts in /tmp/omarchy-acceptance)'
              'not ok - browser opens a window'
              'not ok - launcher shortcut opens'
              'not ok - menu shortcut opens'
              'not ok - style submenu is visible'
              'not ok - universal clipboard test opens Chromium'
            )
            mapfile -t actual_sorted < <(printf '%s\n' "${normalized_failures[@]}" | sort)
            mapfile -t expected_sorted < <(printf '%s\n' "${expected_failures[@]}" | sort)
            (( ${#actual_sorted[@]} == ${#expected_sorted[@]} )) || {
              printf 'unexpected aggregate failure count: %s\n' "${#actual_sorted[@]}" >&2
              printf 'observed: %s\n' "${actual_sorted[@]}" >&2
              exit 1
            }
            for ((i = 0; i < ${#expected_sorted[@]}; ++i)); do
              [[ ${actual_sorted[i]} == "${expected_sorted[i]}" ]] || {
                printf 'aggregate failure set differs at %s: observed %q expected %q\n' \
                  "$i" "${actual_sorted[i]}" "${expected_sorted[i]}" >&2
                exit 1
              }
            done
            echo 'aggregate_acceptance=failed_known_baseline' | tee -a artifacts/provenance.log
          fi
          echo 'plugin_acceptance=pass' | tee -a artifacts/provenance.log
          mapfile -t identity_logs < <(find omarchy-iso/test-runs -type f -name plugin-package-identity.log -print)
          mapfile -t module_logs < <(find omarchy-iso/test-runs -type f -name plugin-host-module.log -print)
          mapfile -t module_shots < <(find omarchy-iso/test-runs -type f -name success-secure-plugin-bridge-module.png -print)
          (( ${#identity_logs[@]} == 1 && ${#module_logs[@]} == 1 && ${#module_shots[@]} == 1 )) || {
            echo "expected exactly one identity log, module log, and module screenshot" >&2
            exit 1
          }
          [[ -s ${identity_logs[0]} && -s ${module_shots[0]} ]] || {
            echo "mandatory identity log or graphical screenshot is empty" >&2
            exit 1
          }

      - name: Collect logs and screenshots only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/acceptance
          if [[ -d omarchy-iso/test-runs ]]; then
            while IFS= read -r -d '' file; do
              relative=${file#omarchy-iso/test-runs/}
              destination="artifacts/acceptance/$relative"
              mkdir -p "$(dirname "$destination")"
              sudo install --mode=0644 --owner="$(id -u)" --group="$(id -g)" -- "$file" "$destination"
            done < <(find omarchy-iso/test-runs -type f \( -name '*.log' -o -name '*.png' \) -print0)
          fi
          find artifacts -type f ! -name '*.log' ! -name '*.png' -delete
          find artifacts -type f -printf '%P\n' | sort

      - name: Upload F5 evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: f5-fresh-iso-${{ env.TARGET_SHA }}
          path: artifacts
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

[package]
name = "omarchy-plugin-host"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[features]
graphics = ["dep:smithay"]
qt-bridge = ["dep:cxx", "dep:cxx-build"]

[dependencies]
libc = "0.2.189"
rustix = { version = "1.1.4", features = ["net", "fs"] }
sha2 = "0.10.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
smithay = { version = "=0.7.0", optional = true, default-features = false, features = ["wayland_frontend", "backend_egl", "backend_gbm", "renderer_gl", "desktop"] }
cxx = { version = "1.0", optional = true }

[build-dependencies]
cxx-build = { version = "1.0", optional = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
